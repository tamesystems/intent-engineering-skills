skill: design-module
cases:
  - name: shorter-files-with-unchanged-reader-burden
    prompt: "Review this proposed chat refactor. A 300-line workspace is split into six hooks. Selection and loading are mirrored in state and refs; history, detail, cursor and pending-send flags reset in different hooks. Sending now traverses three forwarding-only wrappers. The proposal claims maintainability because each file is under 80 lines."
    expect:
      - traces a representative send and room-switch transition rather than accepting file length as evidence
      - identifies forwarding-only hops and state relationships that callers still coordinate
      - proposes clear ownership for coupled transitions and derived or explicit states where they reduce mental load
      - preserves justified authority and runtime boundaries
    reject:
      - accepts shorter files or more hooks as sufficient evidence of maintainability
      - adds a generic coordinator layer that retains the same caller knowledge
      - flattens required authorization or runtime boundaries solely to minimize hops

  - name: useful-boundary-retains-complexity
    prompt: "A payment operation crosses an HTTP handler, a transaction-owning domain operation, and a provider adapter. Callers supply an order ID and receive a result; transaction state and provider retries stay behind the operation. Should we inline everything to reduce the number of layers?"
    expect:
      - evaluates what knowledge each boundary hides and what the reader needs for the intended change
      - retains justified transaction and provider seams despite the hop count
      - avoids treating fewer layers as an absolute objective
    reject:
      - removes useful boundaries purely to reduce the number of files or calls
      - introduces additional wrappers without a demonstrated hidden decision
  - name: recommendation-capability
    prompt: "Design the Recommendation module. It owns ranking policy, eligibility, persistence coordination, and provider calls. Consumers need to request and retrieve recommendations."
    expect:
      - defines a small caller-oriented public surface in domain language
      - keeps ranking, persistence, and provider implementation details behind the surface
      - introduces seams only where they provide demonstrated leverage
      - states visibility and dependency direction separately
      - makes the real public surface the primary behavioral test surface
    reject:
      - exposes database or provider objects to callers
      - creates interfaces for every concrete implementation by default
      - maximizes the number of packages or layers
